<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Fighter Admin</title>
<style>
  :root { --bg:#0e1116; --card:#181d26; --line:#2a3140; --txt:#e8ecf3; --mut:#8a94a6; --acc:#ff7a1a; --ok:#3ddc84; --bad:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 system-ui,sans-serif; padding:16px; max-width:640px; margin:auto; }
  h1 { font-size:20px; margin:8px 0 16px; }
  h1 span { color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  input, select, button { width:100%; font:inherit; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0e1116; color:var(--txt); margin-top:8px; }
  button { background:var(--acc); color:#111; font-weight:700; border:0; cursor:pointer; }
  button.alt { background:#2a3140; color:var(--txt); }
  button:disabled { opacity:.5; }
  .menu { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .menu button { margin:0; }
  .menu button.on { outline:2px solid var(--acc); }
  .row { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child { border:0; }
  .row b { color:var(--acc); }
  .mut { color:var(--mut); font-size:13px; }
  #msg { margin:10px 0; min-height:20px; font-size:14px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .hide { display:none; }
  pre { white-space:pre-wrap; font-size:13px; margin:8px 0 0; }
</style>
</head>
<body>
<h1>Shadow Fighter <span>Admin</span></h1>

<!-- LOGIN -->
<div id="login" class="card">
  <div class="mut">Enter the admin password</div>
  <input id="pw" type="password" placeholder="Admin key" autocomplete="current-password">
  <button id="loginBtn">Log in</button>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div class="card" id="stats"><span class="mut">Loading...</span></div>

  <div class="menu card">
    <button data-tab="players" class="on">Players</button>
    <button data-tab="info">Player info</button>
    <button data-tab="coins">Gift coins</button>
    <button data-tab="gems">Gift gems</button>
    <button data-tab="set">Set coins</button>
    <button data-tab="out" class="alt">Log out</button>
  </div>

  <div id="msg"></div>

  <div id="t-players" class="card tab"><div id="plist" class="mut">Loading...</div><button class="alt" id="refresh">Refresh</button></div>

  <div id="t-info" class="card tab hide">
    <input id="infoId" inputmode="numeric" placeholder="Player ID">
    <button id="infoBtn">Show info</button>
    <pre id="infoOut"></pre>
  </div>

  <div id="t-coins" class="card tab hide">
    <input id="coinTo" placeholder="Player ID or  all">
    <input id="coinAmt" inputmode="numeric" placeholder="Amount of coins">
    <button id="coinBtn">Send coins</button>
  </div>

  <div id="t-gems" class="card tab hide">
    <input id="gemTo" placeholder="Player ID or  all">
    <input id="gemAmt" inputmode="numeric" placeholder="Amount of gems (1 - 1000000)">
    <button id="gemBtn">Send gems</button>
    <div class="mut" style="margin-top:8px">Gems arrive when the player opens the game Online.</div>
  </div>

  <div id="t-set" class="card tab hide">
    <input id="setId" inputmode="numeric" placeholder="Player ID">
    <input id="setAmt" inputmode="numeric" placeholder="Exact coins">
    <button id="setBtn">Set coins</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let KEY = sessionStorage.getItem('sfkey') || '';

function say(t, ok) { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : (ok === false ? 'bad' : ''); }

async function api(method, path, body) {
  let r;
  try {
    r = await fetch(path, { method, headers: { 'x-admin-key': KEY, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error("Can't reach the server (a sleeping free server takes ~50s)"); }
  const j = await r.json().catch(() => ({ ok: false, error: 'HTTP ' + r.status }));
  if (!j.ok) throw new Error(j.error || 'failed');
  return j;
}

async function login() {
  KEY = $('pw').value.trim() || KEY;
  if (!KEY) return say('Enter the password', false);
  $('loginBtn').disabled = true; say('Checking...');
  try {
    await api('GET', '/admin/players');
    sessionStorage.setItem('sfkey', KEY);
    $('login').classList.add('hide'); $('app').classList.remove('hide'); say('');
    loadStats(); loadPlayers();
  } catch (e) { KEY = ''; sessionStorage.removeItem('sfkey'); say(e.message === 'bad admin key' ? 'Wrong password' : e.message, false); }
  $('loginBtn').disabled = false;
}

async function loadStats() {
  try {
    const j = await (await fetch('/api/health')).json();
    $('stats').textContent = 'Players: ' + j.players + '   Searching: ' + j.queue + '   Live matches: ' + j.matches;
  } catch (e) { $('stats').textContent = 'Stats unavailable'; }
}

async function loadPlayers() {
  const box = $('plist'); box.textContent = 'Loading...';
  try {
    const ps = (await api('GET', '/admin/players')).players;
    box.textContent = '';
    const h = document.createElement('div'); h.className = 'mut'; h.textContent = ps.length + ' players (top 100 by coins)'; box.appendChild(h);
    ps.forEach(p => {
      const d = document.createElement('div'); d.className = 'row';
      const a = document.createElement('span'); a.textContent = p.id + '  ' + p.name;
      const b = document.createElement('span'); b.innerHTML = '<b></b> W/L ';
      b.firstChild.textContent = p.coins + ' coins'; b.append(p.wins + '/' + p.losses);
      d.append(a, b); box.appendChild(d);
    });
  } catch (e) { box.textContent = ''; say(e.message, false); }
}

function posInt(v) { const n = parseInt(v, 10); return isFinite(n) && n >= 1 ? n : 0; }

async function gift(kind, to, amount, btn) {
  const n = posInt(amount);
  if (!to) return say('Enter a player ID or "all"', false);
  if (!n) return say('Amount must be 1 or more', false);
  btn.disabled = true; say('Sending...');
  try {
    let ids = [to];
    if (to.toLowerCase() === 'all') ids = (await api('GET', '/admin/players')).players.map(p => p.id);
    let done = 0;
    for (const id of ids) {
      if (kind === 'coins') await api('POST', '/admin/coins', { id, amount: n, mode: 'add' });
      else await api('POST', '/admin/gems', { id, amount: n });
      done++; say('Sending... ' + done + '/' + ids.length);
    }
    say('Sent ' + n + ' ' + kind + ' to ' + done + ' player(s)', true);
    loadPlayers();
  } catch (e) { say('Error: ' + e.message, false); }
  btn.disabled = false;
}

document.querySelectorAll('.menu button').forEach(b => b.onclick = () => {
  const t = b.dataset.tab;
  if (t === 'out') { sessionStorage.removeItem('sfkey'); KEY = ''; $('pw').value = ''; $('app').classList.add('hide'); $('login').classList.remove('hide'); say(''); return; }
  document.querySelectorAll('.menu button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(x => x.classList.add('hide'));
  $('t-' + t).classList.remove('hide'); say('');
  if (t === 'players') loadPlayers();
});

$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('refresh').onclick = () => { loadStats(); loadPlayers(); };
$('coinBtn').onclick = () => gift('coins', $('coinTo').value.trim(), $('coinAmt').value, $('coinBtn'));
$('gemBtn').onclick = () => gift('gems', $('gemTo').value.trim(), $('gemAmt').value, $('gemBtn'));
$('infoBtn').onclick = async () => {
  const id = $('infoId').value.trim(); if (!id) return say('Enter a player ID', false);
  try { const j = await api('GET', '/admin/detail/' + encodeURIComponent(id)); $('infoOut').textContent = JSON.stringify(j.player, null, 2); say(''); }
  catch (e) { $('infoOut').textContent = ''; say('Error: ' + e.message, false); }
};
$('setBtn').onclick = async () => {
  const id = $('setId').value.trim(), n = parseInt($('setAmt').value, 10);
  if (!id || !isFinite(n) || n < 0) return say('Enter a player ID and a number', false);
  try { const j = await api('POST', '/admin/coins', { id, amount: n, mode: 'set' }); say(j.player.name + ' coins set to ' + j.player.coins, true); loadPlayers(); }
  catch (e) { say('Error: ' + e.message, false); }
};

if (KEY) { $('pw').value = KEY; login(); }
</script>
</body>
</html>
