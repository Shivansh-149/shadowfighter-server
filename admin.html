<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Fighter Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0d0a1a; color: #eee; padding: 16px; max-width: 720px; margin-inline: auto; }
  h1 { color: #c080ff; margin: 0 0 4px; font-size: 26px; }
  h2 { margin: 0 0 8px; font-size: 20px; color: #ffe060; }
  .sub { color: #9090c0; font-size: 13px; margin-bottom: 16px; }
  .card { background: #181230; border: 1px solid #332a5a; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #aaa; margin: 8px 0 4px; }
  input { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #443a6a; background: #0d0a1a; color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { flex: 1 1 120px; padding: 12px; font-size: 15px; border: 0; border-radius: 8px; color: #fff; background: #3060c0; cursor: pointer; }
  button.gold { background: #d08a10; }
  button.green { background: #2a9050; }
  button.pink { background: #c03878; }
  #out { min-height: 24px; font-size: 15px; color: #ffe060; white-space: pre-wrap; word-break: break-word; }
  .err { color: #ff8080 !important; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 4px; border-bottom: 1px solid #2a2250; text-align: left; }
  th { color: #9090c0; font-weight: normal; }
  .id { font-family: monospace; color: #fff; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #221a44; }
  dl { display: grid; grid-template-columns: 11em 1fr; gap: 6px 10px; margin: 0; font-size: 15px; }
  dt { color: #9090c0; }
  dd { margin: 0; word-break: break-word; }
  .st-online, .st-searching, .st-in { color: #60e080; }
  .st-offline { color: #808090; }
  #detail { display: none; }
</style>
</head>
<body>
<h1>Shadow Fighter Admin</h1>
<div class="sub" id="srvinfo"></div>

<div class="card">
  <label>Admin key</label>
  <input id="key" type="password" autocomplete="off" placeholder="the ADMIN_KEY shown when the server started">
  <label>Player ID</label>
  <input id="pid" inputmode="numeric" maxlength="10" placeholder="e.g. 472164">
  <div class="row">
    <button onclick="view()">Open player</button>
    <button class="gold" onclick="top()">Refresh players</button>
  </div>
  <div id="out" style="margin-top:12px"></div>
</div>

<div class="card" id="detail">
  <h2 id="dname"></h2>
  <dl id="dl"></dl>
  <label>Amount</label>
  <input id="amt" inputmode="numeric" placeholder="e.g. 500 (coins can be negative)">
  <div class="row">
    <button class="pink" onclick="sendGems()">Send gems</button>
    <button class="green" onclick="sendCoins('add')">Add coins</button>
    <button class="gold" onclick="sendCoins('set')">Set coins</button>
  </div>
</div>

<div class="card">
  <table><thead><tr><th>Name</th><th>ID</th><th>Coins</th><th>W/L</th></tr></thead><tbody id="rows"></tbody></table>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
$('key').value = localStorage.getItem('sf_admin_key') || '';
$('srvinfo').textContent = 'Server: ' + location.origin;

function setOut(t, bad) { $('out').textContent = t; $('out').className = bad ? 'err' : ''; }

function api(method, path, body) {
  var key = $('key').value.trim();
  localStorage.setItem('sf_admin_key', key);
  var opts = { method: method, headers: { 'x-admin-key': key, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  return fetch(path, opts).then(function (r) {
    return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }).then(function (j) { j._status = r.status; return j; });
  }).then(function (j) {
    if (!j.ok) {
      if (j._status === 404 && j.error === 'not found') throw new Error('The server needs the admin update (patch_admin.js)');
      throw new Error(j.error || 'failed');
    }
    return j;
  });
}

function fmtDate(ms) {
  if (!ms) return '?';
  var d = new Date(ms); return d.toLocaleString();
}
function fmtAgo(ms) {
  if (!ms) return 'not seen since the server started';
  var m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago';
}

function row(dl, k, v, cls) {
  var dt = document.createElement('dt'), dd = document.createElement('dd');
  dt.textContent = k; dd.textContent = v; if (cls) dd.className = cls;
  dl.appendChild(dt); dl.appendChild(dd);
}

function showDetail(p) {
  $('detail').style.display = 'block';
  $('dname').textContent = p.name;
  var dl = $('dl'); dl.innerHTML = '';
  var games = p.wins + p.losses;
  row(dl, 'Player ID', p.id);
  row(dl, 'Name', p.name);
  row(dl, 'Status', p.status, 'st-' + String(p.status).split(' ')[0]);
  row(dl, 'Coins', p.coins);
  row(dl, 'Gems sent by admin', p.gemsSent);
  row(dl, 'Gems waiting', p.gemsPending);
  row(dl, 'Wins / losses', p.wins + ' / ' + p.losses);
  row(dl, 'Win rate', games ? Math.round(p.wins * 100 / games) + '%' : '-');
  row(dl, 'Created', fmtDate(p.created));
  row(dl, 'Last seen', fmtAgo(p.lastSeen));
}

function view() {
  var id = $('pid').value.trim();
  if (!id) return setOut('Enter a player ID', true);
  setOut('Loading...');
  api('GET', '/admin/detail/' + id).then(function (j) { showDetail(j.player); setOut(''); top(true); })
    .catch(function (e) { setOut(e.message, true); });
}

function amount() {
  var a = parseInt($('amt').value, 10);
  if (isNaN(a)) { setOut('Enter an amount', true); return null; }
  return a;
}

function sendGems() {
  var id = $('pid').value.trim(), a = amount();
  if (!id || a === null) return;
  if (a < 1) return setOut('Gems must be 1 or more', true);
  api('POST', '/admin/gems', { id: id, amount: a }).then(function (j) {
    showDetail(j.player); setOut('Sent ' + a + ' gems. The player gets them the next time the game contacts the server.');
  }).catch(function (e) { setOut(e.message, true); });
}

function sendCoins(mode) {
  var id = $('pid').value.trim(), a = amount();
  if (!id || a === null) return;
  if (mode === 'set' && !confirm('Set coins of ' + id + ' to ' + a + '?')) return;
  api('POST', '/admin/coins', { id: id, amount: a, mode: mode }).then(function () {
    setOut(mode === 'set' ? 'Coins set.' : 'Coins added.'); view();
  }).catch(function (e) { setOut(e.message, true); });
}

function top(quiet) {
  api('GET', '/admin/players').then(function (j) {
    $('rows').innerHTML = '';
    j.players.forEach(function (p) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td></td><td class="id"></td><td></td><td></td>';
      tr.children[0].textContent = p.name;
      tr.children[1].textContent = p.id;
      tr.children[2].textContent = p.coins;
      tr.children[3].textContent = p.wins + ' / ' + p.losses;
      tr.onclick = function () { $('pid').value = p.id; view(); window.scrollTo(0, 0); };
      $('rows').appendChild(tr);
    });
  }).catch(function (e) { if (!quiet) setOut(e.message, true); });
}

if ($('key').value) top(true);
</script>
</body>
</html>
